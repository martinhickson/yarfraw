name: Manual GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.1.bravura-1 or 1.2.1)"
        required: false
        default: "1.2.1.bravura-1"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, publish, and release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17 and Maven publishing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve release version, tag, and branch
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          INPUT_VERSION="${{ inputs.version }}"
          INPUT_VERSION="${INPUT_VERSION#v}"

          if [[ "${INPUT_VERSION}" =~ \.bravura-[0-9]+$ ]]; then
            RELEASE_VERSION="${INPUT_VERSION}"
          else
            RELEASE_VERSION="${INPUT_VERSION}.bravura-1"
          fi

          TAG_NAME="v${RELEASE_VERSION}"
          RELEASE_BRANCH="release/${RELEASE_VERSION}"
          RELEASE_TITLE="YARFRAW ${TAG_NAME}"

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_branch=${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Configure git user
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or reuse release branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ steps.vars.outputs.release_branch }}"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}:${BRANCH}"
            git switch "${BRANCH}"
          else
            git switch -c "${BRANCH}"
          fi

      - name: Set project version for release branch
        shell: bash
        run: |
          set -euo pipefail
          mvn -B versions:set -DnewVersion="${{ steps.vars.outputs.release_version }}" -DgenerateBackupPoms=false
          if ! git diff --quiet; then
            git add pom.xml
            git commit -m "chore: prepare release ${{ steps.vars.outputs.release_version }}"
          fi
          git push --set-upstream origin "${{ steps.vars.outputs.release_branch }}"

      - name: Build package
        shell: bash
        run: mvn -B clean package

      - name: Publish package to GitHub Packages (Maven)
        shell: bash
        run: |
          mvn -B deploy -DskipTests -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag_name }}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists locally."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin."
            exit 1
          fi
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Prepare release files
        shell: bash
        run: |
          cp pom.xml target/yarfraw-${{ steps.vars.outputs.release_version }}.pom
          for f in target/*.jar target/*.pom; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Prepare release notes
        shell: bash
        run: |
          cat <<EOF > release_notes.md
          ## Release summary
          - Version: \`${{ steps.vars.outputs.release_version }}\`
          - Tag: \`${{ steps.vars.outputs.tag_name }}\`
          - Release branch: \`${{ steps.vars.outputs.release_branch }}\`
          - Maven package: \`https://maven.pkg.github.com/${{ github.repository }}\`

          ## Included assets
          - Compiled JARs produced by the Maven build

          ## Notes
          This release was generated by the manual GitHub release workflow.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          target_commitish: ${{ steps.vars.outputs.release_branch }}
          name: ${{ steps.vars.outputs.release_title }}
          body_path: release_notes.md
          files: |
            target/*.jar
            target/*.pom
            target/*.sha256
